<text x="28" y="80" class="t-head" fill="#1d2433">Endothelium</text>
<text x="28" y="100" class="t-body" fill="#1d2433">P-selectin (minutes)</text>

<text x="28" y="186" class="t-body" fill="#1d2433">(on PSGL-1)</text>
<text x="28" y="216" class="t-head" fill="#1d2433">Bond</text>
<text x="28" y="236" class="t-body" fill="#1d2433">low affinity,</text>
<text x="28" y="254" class="t-body" fill="#1d2433">fast off-rate</text>

<text x="222" y="148" class="t-head" fill="#1d2433">Leukocyte</text>

<text x="222" y="186" class="t-body" fill="#1d2433">inside-out signal</text>
<text x="222" y="216" class="t-head" fill="#1d2433">Result</text>
<text x="222" y="236" class="t-body" fill="#1d2433">integrin extends:</text>
<text x="222" y="254" class="t-body" fill="#1d2433">high affinity</text>
<text x="222" y="284" class="t-small">kindlin-3 needed</text>

<text x="416" y="100" class="t-body" fill="#1d2433">LFA-1, MAC-1 (CR3)</text>
<text x="416" y="118" class="t-body" fill="#1d2433">VLA-4</text>
<text x="416" y="148" class="t-head" fill="#1d2433">Endothelium</text>
<text x="416" y="168" class="t-body" fill="#1d2433">ICAM-1</text>
<text x="416" y="186" class="t-body" fill="#1d2433">VCAM-1</text>
<text x="416" y="216" class="t-head" fill="#1d2433">Result</text>
<text x="416" y="236" class="t-body" fill="#1d2433">cell stops</text>
<text x="416" y="254" class="t-body" fill="#1d2433">and spreads</text>
<text x="416" y="284" class="t-small">β2 integrins = CD18</text>

<text x="610" y="100" class="t-body" fill="#1d2433">between endothelial</text>
<text x="610" y="118" class="t-body" fill="#1d2433">cells (paracellular)</text>
<text x="610" y="148" class="t-head" fill="#1d2433">Molecules</text>
<text x="610" y="168" class="t-body" fill="#1d2433">CD31 (PECAM)</text>
<text x="610" y="186" class="t-body" fill="#1d2433">VE-cadherin opens</text>
<text x="610" y="216" class="t-head" fill="#1d2433">Then</text>
<text x="610" y="236" class="t-body" fill="#1d2433">chemokine gradient</text>
<text x="610" y="254" class="t-body" fill="#1d2433">to infection site</text>
<text x="610" y="284" class="t-small">CXCL8, C5a, fMLP</text>
