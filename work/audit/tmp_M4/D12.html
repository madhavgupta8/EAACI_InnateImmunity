<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/Users/madhavgupta/Projects/Papa_EAACIexam/pack/assets/style.css"><style>body{margin:0} main{max-width:none;padding:0} figure{margin:0;width:800px}</style></head><body><main><figure class="diagram">
<svg viewBox="0 0 800 420" role="img" aria-labelledby="D12t">
<title id="D12t">Five steps of phagocytosis and the main opsonin receptors</title>
<defs><marker id="arr-D12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2433"/></marker></defs>
<text x="20" y="28" class="t-title" fill="#1d2433">Steps of phagocytosis</text>
<rect x="20" y="44" width="136" height="110" rx="8" fill="#e3f1ea" stroke="#2e7d5b" stroke-width="1.5"/>
<text x="88" y="70" text-anchor="middle" class="t-head" fill="#2e7d5b">1 Bind</text>
<text x="88" y="94" text-anchor="middle" class="t-body" fill="#1d2433">PRR or</text>
<text x="88" y="112" text-anchor="middle" class="t-body" fill="#1d2433">opsonin</text>
<text x="88" y="130" text-anchor="middle" class="t-body" fill="#1d2433">receptor</text>
<rect x="176" y="44" width="136" height="110" rx="8" fill="#e3f1ea" stroke="#2e7d5b" stroke-width="1.5"/>
<text x="244" y="70" text-anchor="middle" class="t-head" fill="#2e7d5b">2 Engulf</text>
<text x="244" y="94" text-anchor="middle" class="t-body" fill="#1d2433">membrane cup</text>
<text x="244" y="112" text-anchor="middle" class="t-body" fill="#1d2433">closes over</text>
<text x="244" y="130" text-anchor="middle" class="t-body" fill="#1d2433">particle</text>
<rect x="332" y="44" width="136" height="110" rx="8" fill="#e3f1ea" stroke="#2e7d5b" stroke-width="1.5"/>
<text x="400" y="70" text-anchor="middle" class="t-head" fill="#2e7d5b">3 Phagosome</text>
<text x="400" y="94" text-anchor="middle" class="t-body" fill="#1d2433">vesicle with</text>
<text x="400" y="112" text-anchor="middle" class="t-body" fill="#1d2433">the microbe</text>
<rect x="488" y="44" width="136" height="110" rx="8" fill="#e3f1ea" stroke="#2e7d5b" stroke-width="1.5"/>
<text x="556" y="70" text-anchor="middle" class="t-head" fill="#2e7d5b">4 Fusion</text>
<text x="556" y="94" text-anchor="middle" class="t-body" fill="#1d2433">+ lysosome =</text>
<text x="556" y="112" text-anchor="middle" class="t-body" fill="#1d2433">phagolysosome</text>
<text x="556" y="140" text-anchor="middle" class="t-small" fill="#b23a48">fails in CHS</text>
<rect x="644" y="44" width="136" height="110" rx="8" fill="#e3f1ea" stroke="#2e7d5b" stroke-width="1.5"/>
<text x="712" y="70" text-anchor="middle" class="t-head" fill="#2e7d5b">5 Kill</text>
<text x="712" y="94" text-anchor="middle" class="t-body" fill="#1d2433">ROS, NO,</text>
<text x="712" y="112" text-anchor="middle" class="t-body" fill="#1d2433">enzymes</text>
<text x="712" y="140" text-anchor="middle" class="t-small" fill="#b23a48">ROS fail in CGD</text>
<line x1="157" y1="99" x2="174" y2="99" stroke="#1d2433" stroke-width="2" marker-end="url(#arr-D12)"/>
<line x1="313" y1="99" x2="330" y2="99" stroke="#1d2433" stroke-width="2" marker-end="url(#arr-D12)"/>
<line x1="469" y1="99" x2="486" y2="99" stroke="#1d2433" stroke-width="2" marker-end="url(#arr-D12)"/>
<line x1="625" y1="99" x2="642" y2="99" stroke="#1d2433" stroke-width="2" marker-end="url(#arr-D12)"/>
<text x="20" y="200" class="t-title" fill="#1d2433">Receptors used in step 1</text>
<rect x="20" y="216" width="175" height="184" rx="8" fill="#ece5f5" stroke="#6a4c93" stroke-width="1.5"/>
<text x="107" y="242" text-anchor="middle" class="t-head" fill="#6a4c93">FcγRI (CD64)</text>
<text x="32" y="270" class="t-body" fill="#1d2433">Binds: IgG1, IgG3</text>
<text x="32" y="290" class="t-body" fill="#1d2433">High affinity</text>
<text x="32" y="310" class="t-body" fill="#1d2433">On macrophages</text>
<text x="32" y="328" class="t-body" fill="#1d2433">and neutrophils</text>
<rect x="215" y="216" width="175" height="184" rx="8" fill="#dfeaf6" stroke="#1f6fb2" stroke-width="1.5"/>
<text x="302" y="242" text-anchor="middle" class="t-head" fill="#1f6fb2">CR1 (CD35)</text>
<text x="227" y="270" class="t-body" fill="#1d2433">Binds: C3b, C4b</text>
<text x="227" y="290" class="t-body" fill="#1d2433">Weak alone</text>
<text x="227" y="310" class="t-body" fill="#1d2433">Boosted by IgG–FcγR,</text>
<text x="227" y="328" class="t-body" fill="#1d2433">IFN-γ or C5a</text>
<rect x="410" y="216" width="175" height="184" rx="8" fill="#dfeaf6" stroke="#1f6fb2" stroke-width="1.5"/>
<text x="497" y="242" text-anchor="middle" class="t-head" fill="#1f6fb2">CR3 = MAC-1</text>
<text x="422" y="270" class="t-body" fill="#1d2433">CD11b/CD18</text>
<text x="422" y="290" class="t-body" fill="#1d2433">Binds: iC3b,</text>
<text x="422" y="310" class="t-body" fill="#1d2433">β-glucans</text>
<text x="422" y="330" class="t-body" fill="#1d2433">Also binds ICAM-1</text>
<text x="422" y="356" class="t-small" fill="#b23a48">absent in LAD-1</text>
<rect x="605" y="216" width="175" height="184" rx="8" fill="#e3f1ea" stroke="#2e7d5b" stroke-width="1.5"/>
<text x="692" y="242" text-anchor="middle" class="t-head" fill="#2e7d5b">PRRs</text>
<text x="617" y="270" class="t-body" fill="#1d2433">Direct binding,</text>
<text x="617" y="290" class="t-body" fill="#1d2433">no opsonin</text>
<text x="617" y="310" class="t-body" fill="#1d2433">C-type lectins,</text>
<text x="617" y="328" class="t-body" fill="#1d2433">scavenger</text>
<text x="617" y="346" class="t-body" fill="#1d2433">receptors</text>
</svg>
<figcaption><b>D12.</b> Phagocytosis in five steps (top) and the receptors that bind the microbe (bottom). <span class="src" title="M4-F038,M4-F046,M4-F047,M4-F048">Abbas p.95</span> <span class="src" title="M4-F040,M4-F041,M4-F042,M4-F044">Abbas p.297–313</span> <span class="src" title="M4-F043,M4-F045">Janeway p.63, 78</span> <span class="src" title="M4-F072,M4-F097">Abbas p.486; Janeway p.536</span></figcaption>
</figure></main></body></html>
