<text x="300" y="144" text-anchor="middle" class="t-small t-white" fill="#ffffff">2</text>

<text x="610" y="144" text-anchor="middle" class="t-small t-white" fill="#ffffff">3</text>

<text x="58" y="390" class="t-body" fill="#1d2433">C1-INH concentrate (pd or rh)</text>

<rect x="410" y="364" width="370" height="104" rx="8" fill="#f7e1e4" stroke="#b23a48" stroke-width="1.5"/>
<circle cx="430" cy="386" r="9" fill="#b23a48"/>

<text x="448" y="390" class="t-body" fill="#1d2433">Ecallantide: kallikrein inhibitor</text>
<text x="426" y="410" class="t-small" fill="#1d2433">on-demand · USA only · age 12+ · HCP gives</text>
<circle cx="430" cy="430" r="9" fill="#b23a48"/>
<text x="430" y="434" text-anchor="middle" class="t-small t-white" fill="#ffffff">3</text>
<text x="448" y="434" class="t-body" fill="#1d2433">Icatibant: B2 receptor blocker</text>
<text x="426" y="454" class="t-small" fill="#1d2433">on-demand · self-injected · adults (2017)</text>
<rect x="20" y="484" width="760" height="60" rx="8" fill="#fbecd3" stroke="#c77d14" stroke-width="1.5"/>
<text x="36" y="506" class="t-body" fill="#1d2433">Not histamine: antihistamines, glucocorticoids and adrenaline do not stop HAE attacks.</text>
<text x="36" y="528" class="t-small" fill="#5b6475">Androgens: LTP second line. Tranexamic acid: not recommended for LTP. Their mechanism is not in the sources.</text>
