<html><head><meta charset="utf-8"><link rel="stylesheet" href="file:///Users/madhavgupta/Projects/Papa_EAACIexam/pack/assets/style.css"></head><body><main><figure class="diagram" id="D19">
<svg viewBox="0 0 800 600" role="img" aria-labelledby="D19t">
<title id="D19t">Decision tree for the laboratory work-up of suspected C1-INH deficiency</title>
<defs><marker id="arr-D19" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2433"/></marker></defs>
<rect x="240" y="16" width="320" height="40" rx="8" fill="#f5f7fa" stroke="#1d2433" stroke-width="1.5"/>
<text x="400" y="41" text-anchor="middle" class="t-head" fill="#1d2433">Recurrent angioedema, no wheals</text>
<line x1="400" y1="56" x2="400" y2="80" stroke="#1d2433" stroke-width="1.5" marker-end="url(#arr-D19)"/>
<rect x="200" y="82" width="400" height="58" rx="8" fill="#dfeaf6" stroke="#1f6fb2" stroke-width="1.5"/>
<text x="400" y="106" text-anchor="middle" class="t-body" fill="#1d2433">C1-INH function + C1-INH protein + C4</text>
<text x="400" y="126" text-anchor="middle" class="t-small" fill="#5b6475">repeat low results (Rec. 1)</text>
<!-- branches -->
<line x1="300" y1="140" x2="140" y2="180" stroke="#1d2433" stroke-width="1.5" marker-end="url(#arr-D19)"/>
<line x1="400" y1="140" x2="400" y2="180" stroke="#1d2433" stroke-width="1.5" marker-end="url(#arr-D19)"/>
<line x1="500" y1="140" x2="660" y2="180" stroke="#1d2433" stroke-width="1.5" marker-end="url(#arr-D19)"/>
<rect x="20" y="182" width="240" height="56" rx="8" fill="#f7e1e4" stroke="#b23a48" stroke-width="1.5"/>
<text x="140" y="205" text-anchor="middle" class="t-body" fill="#1d2433">Function ↓  Protein ↓</text>
<text x="140" y="226" text-anchor="middle" class="t-small" fill="#5b6475">C4 usually ↓</text>
<rect x="280" y="182" width="240" height="56" rx="8" fill="#f7e1e4" stroke="#b23a48" stroke-width="1.5"/>
<text x="400" y="205" text-anchor="middle" class="t-body" fill="#1d2433">Function ↓  Protein N or ↑</text>
<text x="400" y="226" text-anchor="middle" class="t-small" fill="#5b6475">C4 usually ↓</text>
<rect x="540" y="182" width="240" height="56" rx="8" fill="#e3f1ea" stroke="#2e7d5b" stroke-width="1.5"/>
<text x="660" y="214" text-anchor="middle" class="t-body" fill="#1d2433">Function N  Protein N</text>
<!-- left: C1q -->
<line x1="140" y1="238" x2="140" y2="268" stroke="#1d2433" stroke-width="1.5" marker-end="url(#arr-D19)"/>
<rect x="20" y="270" width="240" height="64" rx="8" fill="#fbecd3" stroke="#c77d14" stroke-width="1.5"/>
<text x="140" y="292" text-anchor="middle" class="t-body" fill="#1d2433">Measure C1q</text>
<text x="140" y="310" text-anchor="middle" class="t-small" fill="#5b6475">esp. onset after age 40</text>
<text x="140" y="325" text-anchor="middle" class="t-small" fill="#5b6475">and no family history</text>
<line x1="90" y1="334" x2="78" y2="372" stroke="#1d2433" stroke-width="1.5" marker-end="url(#arr-D19)"/>
<line x1="190" y1="334" x2="202" y2="372" stroke="#1d2433" stroke-width="1.5" marker-end="url(#arr-D19)"/>
<rect x="20" y="374" width="116" height="120" rx="8" fill="#6a4c93" stroke="#6a4c93" stroke-width="1.5"/>
<text x="78" y="396" text-anchor="middle" class="t-small t-white" fill="#ffffff">C1q normal</text>
<text x="78" y="418" text-anchor="middle" class="t-head t-white" fill="#ffffff">HAE-1</text>
<text x="78" y="440" text-anchor="middle" class="t-small t-white" fill="#ffffff">~85% of HAE</text>
<text x="78" y="458" text-anchor="middle" class="t-small t-white" fill="#ffffff">young onset</text>
<rect x="144" y="374" width="116" height="120" rx="8" fill="#c77d14" stroke="#c77d14" stroke-width="1.5"/>
<text x="202" y="396" text-anchor="middle" class="t-small t-white" fill="#ffffff">C1q low (75%)</text>
<text x="202" y="418" text-anchor="middle" class="t-head t-white" fill="#ffffff">AAE-C1-INH</text>
<text x="202" y="440" text-anchor="middle" class="t-small t-white" fill="#ffffff">lymphoma</text>
<text x="202" y="458" text-anchor="middle" class="t-small t-white" fill="#ffffff">MGUS</text>
<text x="202" y="476" text-anchor="middle" class="t-small t-white" fill="#ffffff">autoantibodies</text>
<!-- middle -->
<line x1="400" y1="238" x2="400" y2="268" stroke="#1d2433" stroke-width="1.5" marker-end="url(#arr-D19)"/>
<rect x="300" y="270" width="200" height="64" rx="8" fill="#6a4c93" stroke="#6a4c93" stroke-width="1.5"/>
<text x="400" y="296" text-anchor="middle" class="t-head t-white" fill="#ffffff">HAE-2</text>
<text x="400" y="318" text-anchor="middle" class="t-small t-white" fill="#ffffff">dysfunctional C1-INH</text>
<!-- right -->
<line x1="660" y1="238" x2="660" y2="268" stroke="#1d2433" stroke-width="1.5" marker-end="url(#arr-D19)"/>
<rect x="540" y="270" width="240" height="132" rx="8" fill="#f5f7fa" stroke="#2e7d5b" stroke-width="1.5"/>
<text x="660" y="292" text-anchor="middle" class="t-body" fill="#1d2433">Consider:</text>
<text x="556" y="314" class="t-body" fill="#1d2433">• HAE nC1-INH (FXII,</text>
<text x="570" y="332" class="t-body" fill="#1d2433">ANGPT1, PLG, UNK)</text>
<text x="556" y="352" class="t-body" fill="#1d2433">• ACEI-AE</text>
<text x="556" y="372" class="t-body" fill="#1d2433">• Mast cell-mediated AE</text>
<text x="556" y="392" class="t-body" fill="#1d2433">• Idiopathic AE</text>
<!-- side notes -->
<rect x="300" y="420" width="480" height="70" rx="8" fill="#f5f7fa" stroke="#d9dee7" stroke-width="1.5"/>
<text x="316" y="444" class="t-body" fill="#1d2433">C3 and CH50: expected normal in HAE → not helpful</text>
<text x="316" y="466" class="t-body" fill="#1d2433">C1q: nearly always normal in HAE</text>
<text x="316" y="482" class="t-small" fill="#5b6475">may be normal in AAE on anabolic androgens</text>
<rect x="20" y="506" width="760" height="76" rx="8" fill="#fbecd3" stroke="#c77d14" stroke-width="1.5"/>
<text x="36" y="530" class="t-body" fill="#1d2433">Caveats: C4 not useful under 12 months; cord blood gives falsely low values;</text>
<text x="36" y="550" class="t-body" fill="#1d2433">C1-INH falls in normal pregnancy → repeat after delivery.</text>
<text x="36" y="570" class="t-small" fill="#5b6475">CH50 / AH50 screening for single-component deficiency: not in provided sources.</text>
</svg>
