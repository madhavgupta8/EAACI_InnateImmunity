<text x="400" y="28" text-anchor="middle" class="t-title">Where each regulator puts on the brakes</text>

<rect x="640" y="65" width="140" height="70" rx="8"/>
</g>
<text x="90" y="88" text-anchor="middle" class="t-head">C1-INH</text>
<text x="90" y="106" text-anchor="middle" class="t-body">serpin: blocks</text>
<text x="90" y="122" text-anchor="middle" class="t-body">C1r, C1s, MASP2</text>
<text x="245" y="88" text-anchor="middle" class="t-head">C4BP</text>
<text x="245" y="106" text-anchor="middle" class="t-body">displaces C2a;</text>
<text x="245" y="122" text-anchor="middle" class="t-body">factor I cofactor</text>
<text x="400" y="88" text-anchor="middle" class="t-head">Factor H</text>
<text x="400" y="106" text-anchor="middle" class="t-body">displaces Bb;</text>
<text x="400" y="122" text-anchor="middle" class="t-body">factor I cofactor</text>
<text x="555" y="88" text-anchor="middle" class="t-head">Factor I</text>
<text x="555" y="106" text-anchor="middle" class="t-body">cuts C3b, C4b</text>
<text x="555" y="122" text-anchor="middle" class="t-body">(needs cofactor)</text>
<text x="710" y="88" text-anchor="middle" class="t-head">S protein</text>
<text x="710" y="106" text-anchor="middle" class="t-body">(vitronectin)</text>
<text x="710" y="122" text-anchor="middle" class="t-body">binds C5b-7</text>

<rect x="640" y="195" width="140" height="64" rx="8"/>
</g>
<text x="90" y="219" text-anchor="middle" class="t-head">Initiation</text>
<text x="90" y="240" text-anchor="middle" class="t-body">C1r, C1s / MASP2</text>
<text x="245" y="219" text-anchor="middle" class="t-head">C3 convertase</text>
<text x="245" y="240" text-anchor="middle" class="t-body">C4b2a · C3bBb</text>
<text x="400" y="219" text-anchor="middle" class="t-head">C3b / C4b</text>
<text x="400" y="240" text-anchor="middle" class="t-body">on the surface</text>
<text x="555" y="219" text-anchor="middle" class="t-head">C5 convertase</text>
<text x="555" y="240" text-anchor="middle" class="t-body">→ C5a + C5b</text>
<text x="710" y="219" text-anchor="middle" class="t-head">MAC</text>
<text x="710" y="240" text-anchor="middle" class="t-body">C5b-9 pore</text>

<line x1="160" y1="227" x2="174" y2="227"/><line x1="315" y1="227" x2="329" y2="227"/>
<line x1="470" y1="227" x2="484" y2="227"/><line x1="625" y1="227" x2="639" y2="227"/>
</g>
<!-- membrane row -->
<text x="90" y="345" text-anchor="middle" class="t-small">MEMBRANE</text>
<text x="90" y="360" text-anchor="middle" class="t-small">REGULATORS</text>
<text x="90" y="375" text-anchor="middle" class="t-small">(host cells only)</text>
<g stroke="#2e7d5b" stroke-width="1.5" fill="#e3f1ea">
<rect x="175" y="320" width="140" height="70" rx="8"/><rect x="330" y="320" width="140" height="70" rx="8"/>
<rect x="485" y="320" width="140" height="70" rx="8"/><rect x="640" y="320" width="140" height="70" rx="8"/>
</g>
<text x="245" y="343" text-anchor="middle" class="t-head">DAF (CD55)</text>
<text x="245" y="361" text-anchor="middle" class="t-body">GPI; speeds decay</text>
<text x="245" y="377" text-anchor="middle" class="t-body">of C3 convertases</text>
<text x="400" y="343" text-anchor="middle" class="t-head">MCP (CD46)</text>
<text x="400" y="361" text-anchor="middle" class="t-body">cofactor for</text>
<text x="400" y="377" text-anchor="middle" class="t-body">factor I</text>
<text x="555" y="343" text-anchor="middle" class="t-head">CR1 (CD35)</text>
<text x="555" y="361" text-anchor="middle" class="t-body">decay + cofactor</text>
<text x="555" y="377" text-anchor="middle" class="t-body">for factor I</text>
<text x="710" y="343" text-anchor="middle" class="t-head">CD59</text>
<text x="710" y="361" text-anchor="middle" class="t-body">(protectin); GPI</text>
<text x="710" y="377" text-anchor="middle" class="t-body">blocks C9 binding</text>

<line x1="555" y1="135" x2="452" y2="192"/>
<line x1="710" y1="135" x2="710" y2="192"/>
<line x1="245" y1="320" x2="245" y2="262"/>
<line x1="400" y1="320" x2="400" y2="262"/>

<line x1="710" y1="320" x2="710" y2="262"/>

<text x="20" y="466" class="t-small">Also: plasma carboxypeptidases inactivate C3a and C5a (des-Arg forms keep about 10% activity).</text>
