<html><head><link rel="stylesheet" href="file:///Users/madhavgupta/Projects/Papa_EAACIexam/pack/assets/style.css"></head><body><main><figure class="diagram" id="D16">
<svg viewBox="0 0 800 545" role="img" aria-labelledby="D16t">
<title id="D16t">From C3 convertase to C5 convertase to membrane attack complex</title>
<defs><marker id="arr-D16" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2433"/></marker></defs>
<text x="400" y="28" text-anchor="middle" class="t-title">From C3 convertase to C5 convertase to MAC</text>
<text x="20" y="60" class="t-head">1 · Add one C3b: the C3 convertase becomes a C5 convertase</text>
<!-- row 1 -->
<rect x="20" y="75" width="210" height="60" rx="8" fill="#ece5f5" stroke="#6a4c93" stroke-width="1.5"/>
<text x="125" y="97" text-anchor="middle" class="t-head">C4b2a</text>
<text x="125" y="114" text-anchor="middle" class="t-body">C3 convertase</text>
<text x="125" y="129" text-anchor="middle" class="t-small">classical + lectin</text>
<rect x="300" y="75" width="230" height="60" rx="8" fill="#ece5f5" stroke="#6a4c93" stroke-width="1.5"/>
<text x="415" y="97" text-anchor="middle" class="t-head">C4b2a3b</text>
<text x="415" y="114" text-anchor="middle" class="t-body">C5 convertase</text>
<text x="415" y="129" text-anchor="middle" class="t-small">classical + lectin</text>
<!-- row 2 -->
<rect x="20" y="150" width="210" height="60" rx="8" fill="#dfeaf6" stroke="#1f6fb2" stroke-width="1.5"/>
<text x="125" y="172" text-anchor="middle" class="t-head">C3bBb</text>
<text x="125" y="189" text-anchor="middle" class="t-body">C3 convertase</text>
<text x="125" y="204" text-anchor="middle" class="t-small">alternative</text>
<rect x="300" y="150" width="230" height="60" rx="8" fill="#dfeaf6" stroke="#1f6fb2" stroke-width="1.5"/>
<text x="415" y="172" text-anchor="middle" class="t-head">C3bBb3b</text>
<text x="415" y="189" text-anchor="middle" class="t-body">C5 convertase</text>
<text x="415" y="204" text-anchor="middle" class="t-small">alternative (Janeway: C3b2Bb)</text>
<!-- C5 cleavage box -->
<rect x="590" y="75" width="190" height="135" rx="8" fill="#f5f7fa" stroke="#1d2433" stroke-width="1.5"/>
<text x="685" y="99" text-anchor="middle" class="t-head">C5 is cleaved</text>
<text x="685" y="122" text-anchor="middle" class="t-body">C5a → released,</text>
<text x="685" y="139" text-anchor="middle" class="t-body">anaphylatoxin</text>
<text x="685" y="162" text-anchor="middle" class="t-body">C5b → starts</text>
<text x="685" y="179" text-anchor="middle" class="t-body">the MAC</text>
<text x="685" y="199" text-anchor="middle" class="t-small">enzyme: C2a or Bb</text>
<g stroke="#1d2433" stroke-width="1.5" marker-end="url(#arr-D16)">
<line x1="230" y1="105" x2="298" y2="105"/><line x1="230" y1="180" x2="298" y2="180"/>
<line x1="530" y1="105" x2="588" y2="120"/><line x1="530" y1="180" x2="588" y2="165"/>
</g>
<text x="264" y="97" text-anchor="middle" class="t-body">+ C3b</text>
<text x="264" y="172" text-anchor="middle" class="t-body">+ C3b</text>
<!-- section 2 -->
<text x="20" y="245" class="t-head">2 · Build the membrane attack complex (MAC) on the target membrane</text>
<g stroke-width="1.5">
<rect x="20" y="260" width="140" height="70" rx="8" fill="#f5f7fa" stroke="#5b6475"/>
<rect x="175" y="260" width="140" height="70" rx="8" fill="#f5f7fa" stroke="#5b6475"/>
<rect x="330" y="260" width="140" height="70" rx="8" fill="#f5f7fa" stroke="#5b6475"/>
<rect x="485" y="260" width="140" height="70" rx="8" fill="#f5f7fa" stroke="#5b6475"/>
<rect x="640" y="260" width="140" height="70" rx="8" fill="#dfeaf6" stroke="#1f6fb2"/>
</g>
<text x="90" y="281" text-anchor="middle" class="t-head">C5b + C6</text>
<text x="90" y="299" text-anchor="middle" class="t-body">C5b-6 forms</text>
<text x="90" y="316" text-anchor="middle" class="t-body">(not inserted)</text>
<text x="245" y="281" text-anchor="middle" class="t-head">+ C7</text>
<text x="245" y="299" text-anchor="middle" class="t-body">C5b-7 inserts</text>
<text x="245" y="316" text-anchor="middle" class="t-body">into the bilayer</text>
<text x="400" y="281" text-anchor="middle" class="t-head">+ C8</text>
<text x="400" y="299" text-anchor="middle" class="t-body">C5b-8: small,</text>
<text x="400" y="316" text-anchor="middle" class="t-body">unstable pores</text>
<text x="555" y="281" text-anchor="middle" class="t-head">+ C9</text>
<text x="555" y="299" text-anchor="middle" class="t-body">first C9 binding</text>
<text x="555" y="316" text-anchor="middle" class="t-body">is rate-limiting</text>
<text x="710" y="281" text-anchor="middle" class="t-head">MAC = C5b-9</text>
<text x="710" y="299" text-anchor="middle" class="t-body">poly-C9 pore</text>
<text x="710" y="316" text-anchor="middle" class="t-body">water in → lysis</text>
<g stroke="#1d2433" stroke-width="1.5" marker-end="url(#arr-D16)">
<line x1="160" y1="295" x2="174" y2="295"/><line x1="315" y1="295" x2="329" y2="295"/>
<line x1="470" y1="295" x2="484" y2="295"/><line x1="625" y1="295" x2="639" y2="295"/>
</g>
<!-- membrane -->
<rect x="20" y="400" width="760" height="34" rx="4" fill="#fbecd3" stroke="#c77d14" stroke-width="1.5"/>
<text x="20" y="452" class="t-small">Target cell membrane (lipid bilayer)</text>
<!-- col1 -->
<circle cx="76" cy="368" r="14" fill="#dfeaf6" stroke="#1f6fb2" stroke-width="1.5"/><text x="76" y="372" text-anchor="middle" class="t-small">C5b</text>
<circle cx="104" cy="368" r="14" fill="#dfeaf6" stroke="#1f6fb2" stroke-width="1.5"/><text x="104" y="372" text-anchor="middle" class="t-small">C6</text>
<!-- col2 -->
<circle cx="231" cy="360" r="14" fill="#dfeaf6" stroke="#1f6fb2" stroke-width="1.5"/><text x="231" y="364" text-anchor="middle" class="t-small">C5b</text>
<circle cx="259" cy="360" r="14" fill="#dfeaf6" stroke="#1f6fb2" stroke-width="1.5"/><text x="259" y="364" text-anchor="middle" class="t-small">C6</text>
<rect x="238" y="378" width="14" height="40" rx="3" fill="#ece5f5" stroke="#6a4c93" stroke-width="1.5"/><text x="258" y="394" class="t-small">C7</text>
<!-- col3 -->
<circle cx="386" cy="360" r="14" fill="#dfeaf6" stroke="#1f6fb2" stroke-width="1.5"/><text x="386" y="364" text-anchor="middle" class="t-small">C5b</text>
<circle cx="414" cy="360" r="14" fill="#dfeaf6" stroke="#1f6fb2" stroke-width="1.5"/><text x="414" y="364" text-anchor="middle" class="t-small">C6</text>
<rect x="380" y="378" width="12" height="42" rx="3" fill="#ece5f5" stroke="#6a4c93" stroke-width="1.5"/><text x="375" y="394" text-anchor="end" class="t-small">C7</text>
<rect x="408" y="378" width="12" height="42" rx="3" fill="#f7e1e4" stroke="#b23a48" stroke-width="1.5"/><text x="425" y="394" class="t-small">C8</text>
<!-- col4 -->
<circle cx="555" cy="358" r="14" fill="#dfeaf6" stroke="#1f6fb2" stroke-width="1.5"/><text x="555" y="362" text-anchor="middle" class="t-small">C5b</text>
<rect x="529" y="380" width="10" height="46" rx="3" fill="#1f6fb2"/>
<rect x="545" y="380" width="10" height="46" rx="3" fill="#1f6fb2"/>
<rect x="561" y="380" width="10" height="46" rx="3" fill="#1f6fb2"/>
<text x="578" y="394" class="t-small">C9</text>
<!-- col5 pore -->
<text x="710" y="360" text-anchor="middle" class="t-small">poly-C9 pore</text>
<rect x="676" y="374" width="18" height="72" rx="3" fill="#1f6fb2"/>
<rect x="726" y="374" width="18" height="72" rx="3" fill="#1f6fb2"/>
<line x1="710" y1="374" x2="710" y2="444" stroke="#1d2433" stroke-width="1.5" marker-end="url(#arr-D16)"/>
<text x="750" y="392" class="t-small">H₂O in</text>
<!-- notes -->
<text x="20" y="484" class="t-body">• Abbas: up to 18 C9 per pore. Janeway: 10–16 C9. Same idea, different counts.</text>
<text x="20" y="506" class="t-body">• C5b-7 and C5b-8 already enter the membrane; C9 completes the channel.</text>
<text x="20" y="528" class="t-body">• Water and ions flow in, the cell swells and bursts (osmotic lysis).</text>
</svg>
<figcaption><b>D16.</b> Top: one extra C3b turns each C3 convertase into a C5 convertase. Bottom: C5b collects C6, C7, C8 and many C9 molecules to build the MAC pore. <span class="src" title="M5-F023,M5-F036,M5-F037,M5-F038,M5-F040,M5-F041,M5-F042,M5-F043,M5-F044,M5-F045">Abbas p.306; Abbas p.303; Janeway p.62; Abbas p.307; Janeway p.66</span></figcaption>
</figure></main></body></html>
