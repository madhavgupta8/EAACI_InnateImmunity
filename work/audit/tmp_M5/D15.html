<html><head><link rel="stylesheet" href="file:///Users/madhavgupta/Projects/Papa_EAACIexam/pack/assets/style.css"></head><body><main><figure class="diagram" id="D15">
<svg viewBox="0 0 800 510" role="img" aria-labelledby="D15t">
<title id="D15t">Three complement pathways converge on a C3 convertase</title>
<defs><marker id="arr-D15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2433"/></marker></defs>
<text x="400" y="28" text-anchor="middle" class="t-title">Three pathways, one goal: a C3 convertase</text>
<!-- headers -->
<rect x="20" y="45" width="240" height="40" rx="8" fill="#6a4c93"/>
<text x="140" y="70" text-anchor="middle" class="t-head t-white">Classical pathway</text>
<rect x="280" y="45" width="240" height="40" rx="8" fill="#2e7d5b"/>
<text x="400" y="70" text-anchor="middle" class="t-head t-white">Lectin pathway</text>
<rect x="540" y="45" width="240" height="40" rx="8" fill="#1f6fb2"/>
<text x="660" y="70" text-anchor="middle" class="t-head t-white">Alternative pathway</text>
<!-- triggers -->
<rect x="20" y="100" width="240" height="70" rx="8" fill="#ece5f5" stroke="#6a4c93" stroke-width="1.5"/>
<text x="140" y="122" text-anchor="middle" class="t-body">Trigger: antigen-bound IgM or</text>
<text x="140" y="140" text-anchor="middle" class="t-body">IgG (immune complex),</text>
<text x="140" y="158" text-anchor="middle" class="t-body">or CRP on a microbe</text>
<rect x="280" y="100" width="240" height="70" rx="8" fill="#e3f1ea" stroke="#2e7d5b" stroke-width="1.5"/>
<text x="400" y="122" text-anchor="middle" class="t-body">Trigger: microbial sugars</text>
<text x="400" y="140" text-anchor="middle" class="t-body">mannose → MBL</text>
<text x="400" y="158" text-anchor="middle" class="t-body">N-acetylglucosamine → ficolins</text>
<rect x="540" y="100" width="240" height="70" rx="8" fill="#dfeaf6" stroke="#1f6fb2" stroke-width="1.5"/>
<text x="660" y="122" text-anchor="middle" class="t-body">Trigger: spontaneous C3</text>
<text x="660" y="140" text-anchor="middle" class="t-body">tick-over; C3b sticks to a</text>
<text x="660" y="158" text-anchor="middle" class="t-body">surface without regulators</text>
<!-- sensors -->
<rect x="20" y="185" width="240" height="60" rx="8" fill="#ece5f5" stroke="#6a4c93" stroke-width="1.5"/>
<text x="140" y="209" text-anchor="middle" class="t-head">Sensor: C1q</text>
<text x="140" y="230" text-anchor="middle" class="t-body">Proteases: C1r → C1s</text>
<rect x="280" y="185" width="240" height="60" rx="8" fill="#e3f1ea" stroke="#2e7d5b" stroke-width="1.5"/>
<text x="400" y="209" text-anchor="middle" class="t-head">Sensor: MBL or ficolin</text>
<text x="400" y="230" text-anchor="middle" class="t-body">Proteases: MASP1 → MASP2</text>
<rect x="540" y="185" width="240" height="60" rx="8" fill="#dfeaf6" stroke="#1f6fb2" stroke-width="1.5"/>
<text x="660" y="209" text-anchor="middle" class="t-head">C3b binds factor B</text>
<text x="660" y="230" text-anchor="middle" class="t-body">factor D cuts B → Bb + Ba</text>
<!-- steps -->
<rect x="20" y="260" width="240" height="50" rx="8" fill="#ece5f5" stroke="#6a4c93" stroke-width="1.5"/>
<text x="140" y="281" text-anchor="middle" class="t-body">C1s cleaves C4, then C2</text>
<text x="140" y="299" text-anchor="middle" class="t-small">(C4b binds the surface)</text>
<rect x="280" y="260" width="240" height="50" rx="8" fill="#e3f1ea" stroke="#2e7d5b" stroke-width="1.5"/>
<text x="400" y="281" text-anchor="middle" class="t-body">MASP2 cleaves C4, then C2</text>
<text x="400" y="299" text-anchor="middle" class="t-small">(same steps as classical)</text>
<rect x="540" y="260" width="240" height="50" rx="8" fill="#dfeaf6" stroke="#1f6fb2" stroke-width="1.5"/>
<text x="660" y="281" text-anchor="middle" class="t-body">Properdin stabilizes C3bBb</text>
<text x="660" y="299" text-anchor="middle" class="t-small">(favored on microbial surfaces)</text>
<!-- convertases -->
<rect x="20" y="330" width="240" height="50" rx="8" fill="#6a4c93"/>
<text x="140" y="361" text-anchor="middle" class="t-head t-white">C3 convertase: C4b2a</text>
<rect x="280" y="330" width="240" height="50" rx="8" fill="#2e7d5b"/>
<text x="400" y="361" text-anchor="middle" class="t-head t-white">C3 convertase: C4b2a</text>
<rect x="540" y="330" width="240" height="50" rx="8" fill="#1f6fb2"/>
<text x="660" y="361" text-anchor="middle" class="t-head t-white">C3 convertase: C3bBb</text>
<!-- vertical arrows -->
<g stroke="#1d2433" stroke-width="1.5" marker-end="url(#arr-D15)">
<line x1="140" y1="170" x2="140" y2="184"/><line x1="140" y1="245" x2="140" y2="259"/><line x1="140" y1="310" x2="140" y2="329"/>
<line x1="400" y1="170" x2="400" y2="184"/><line x1="400" y1="245" x2="400" y2="259"/><line x1="400" y1="310" x2="400" y2="329"/>
<line x1="660" y1="170" x2="660" y2="184"/><line x1="660" y1="245" x2="660" y2="259"/><line x1="660" y1="310" x2="660" y2="329"/>
<line x1="140" y1="380" x2="250" y2="419"/><line x1="400" y1="380" x2="400" y2="419"/><line x1="660" y1="380" x2="550" y2="419"/>
</g>
<!-- central -->
<rect x="200" y="420" width="400" height="50" rx="8" fill="#dfeaf6" stroke="#1f6fb2" stroke-width="2"/>
<text x="400" y="442" text-anchor="middle" class="t-head">C3 → C3a + C3b</text>
<text x="400" y="460" text-anchor="middle" class="t-small">C3a: inflammation · C3b: opsonin, builds the C5 convertase</text>
<!-- amplification loop -->
<path d="M600,450 C690,450 740,430 740,382" fill="none" stroke="#c77d14" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-D15)"/>
<text x="615" y="482" class="t-small">Amplification loop: new C3b</text>
<text x="615" y="496" class="t-small">binds factor B → more C3bBb</text>
</svg>
<figcaption><b>D15.</b> The three pathways differ only in how they start. Classical and lectin pathways build the same C3 convertase (C4b2a); the alternative pathway builds C3bBb. Every C3b made by any pathway can enter the alternative-pathway amplification loop (dashed). <span class="src" title="M5-F012,M5-F013,M5-F019,M5-F025,M5-F027,M5-F028,M5-F029,M5-F022,M5-F030,M5-F032,M5-F035,M5-F033">Abbas p.301; Abbas p.305; Abbas p.306; Abbas p.307; Janeway p.54; Abbas p.302</span></figcaption>
</figure></main></body></html>
